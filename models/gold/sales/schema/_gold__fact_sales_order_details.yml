version: 2

models:
  - name: gold__fact_sales_order_details
    description: >
      Line-level sales fact containing dimensional identifiers, order attributes,
      quantities, prices, discounts, and calculated amounts. Its grain is one row
      per sales order detail.
    columns:
      - name: sales_order_detail_id_pk
        description: Primary identifier for the sales order detail row.
        data_tests:
          - not_null
          - unique

      - name: sales_order_id
        description: Identifier of the parent sales order.
        data_tests:
          - not_null

      - name: customer_id
        description: Identifier of the customer who placed the order.

      - name: territory_id
        description: Identifier of the sales territory.

      - name: credit_card_id
        description: Identifier of the credit card used for the order.

      - name: bill_to_address_id
        description: Identifier of the billing address.

      - name: ship_to_address_id
        description: Identifier of the delivery address.

      - name: ship_method_id
        description: Identifier of the shipping method.

      - name: currency_rate_id
        description: Identifier of the currency exchange rate.

      - name: product_id
        description: Identifier of the product sold.
        data_tests:
          - not_null

      - name: special_offer_id
        description: Identifier of the special offer applied to the item.

      - name: revision_number
        description: Revision number of the sales order.

      - name: order_date
        description: Date on which the order was created.
        data_tests:
          - not_null

      - name: order_month
        description: First day of the month in which the order was created.

      - name: due_date
        description: Date on which the order was due.

      - name: ship_date
        description: Date on which the order was shipped.

      - name: sales_order_status
        description: Status code of the sales order.

      - name: online_order_flag
        description: Indicates whether the order was placed online.

      - name: purchase_order_number
        description: Purchase order number associated with the sale.

      - name: account_number
        description: Account number associated with the sales order.

      - name: credit_card_approval_code
        description: Approval code returned for the credit card transaction.

      - name: carrier_tracking_number
        description: Carrier tracking number associated with the order item.

      - name: order_qty
        description: Quantity of the product ordered.
        data_tests:
          - not_null

      - name: unit_price
        description: Unit price of the product at the time of sale.

      - name: unit_price_discount
        description: Discount percentage applied to the unit price.

      - name: gross_amount
        description: Gross item amount before discounts.

      - name: discount_amount
        description: Discount amount applied to the item.

      - name: net_amount
        description: Net item amount after discounts.
