version: 2

unit_tests:
  - name: test_stg_product__products_renames
    description: Validates product column renaming from the Adventure Works source.
    model: stg_product__products
    given:
      - input: source('adventure_works', 'production_product')
        format: dict
        rows:
          - productid: 680
            name: HL Road Frame - Black, 58
            productnumber: FR-R92B-58
            makeflag: true
            finishedgoodsflag: true
            color: Black
            safetystocklevel: 500
            reorderpoint: 375
            standardcost: 1059.31
            listprice: 1431.50
            size: "58"
            sizeunitmeasurecode: CM
            weightunitmeasurecode: LB
            weight: 2.24
            daystomanufacture: 1
            productline: R
            class: H
            style: U
            productsubcategoryid: 14
            productmodelid: 6
            sellstartdate: "2008-04-30 00:00:00"
            sellenddate: null
            discontinueddate: null
            modifieddate: "2014-02-08 10:01:36"
    expect:
      format: dict
      rows:
        - product_id: 680
          product_name: HL Road Frame - Black, 58
          product_number: FR-R92B-58
          make_flag: true
          finished_goods_flag: true
          color: Black
          safety_stock_level: 500
          reorder_point: 375
          standard_cost: 1059.31
          list_price: 1431.50
          product_size: "58"
          size_unit_measure_code: CM
          weight_unit_measure_code: LB
          product_weight: 2.24
          days_to_manufacture: 1
          product_line: R
          class: H
          style: U
          product_subcategory_id: 14
          product_model_id: 6
          sell_start_date: "2008-04-30 00:00:00"
          sell_end_date: null
          discontinued_date: null
          modified_date: "2014-02-08 10:01:36"
