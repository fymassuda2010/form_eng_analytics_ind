version: 2

models:
  - name: stg_product__products
    description: >
      Staging model for Adventure Works products. Standardizes product identifiers
      and renames product attributes from the raw production_product source.
    columns:
      - name: product_id
        description: Primary identifier for the product.
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Name of the product.
        data_tests:
          - not_null

      - name: product_number
        description: Business product number used to identify the product.
        data_tests:
          - not_null

      - name: make_flag
        description: Flag indicating whether the product is manufactured by Adventure Works.

      - name: finished_goods_flag
        description: Flag indicating whether the product is a sellable finished good.

      - name: color
        description: Product color, when applicable.

      - name: safety_stock_level
        description: Minimum inventory quantity considered safe for the product.

      - name: reorder_point
        description: Inventory level at which replenishment should be triggered.

      - name: standard_cost
        description: Standard cost of the product.

      - name: list_price
        description: Listed selling price of the product.

      - name: product_size
        description: Product size, when applicable.

      - name: size_unit_measure_code
        description: Unit of measure code used for product size.

      - name: weight_unit_measure_code
        description: Unit of measure code used for product weight.

      - name: product_weight
        description: Weight of the product, when applicable.

      - name: days_to_manufacture
        description: Number of days required to manufacture the product.

      - name: product_line
        description: Product line classification.

      - name: class
        description: Product class classification.

      - name: style
        description: Product style classification.

      - name: product_subcategory_id
        description: Identifier of the product subcategory.

      - name: product_model_id
        description: Identifier of the product model.

      - name: sell_start_date
        description: Date when the product became available for sale.

      - name: sell_end_date
        description: Date when the product stopped being available for sale.

      - name: discontinued_date
        description: Date when the product was discontinued.

      - name: modified_date
        description: Timestamp of the last modification in the source system.
