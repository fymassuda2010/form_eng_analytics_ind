version: 2

unit_tests:
  - name: test_stg_person__addresses_renames
    description: Validates address column renaming from the Adventure Works source.
    model: stg_person__addresses
    given:
      - input: source('adventure_works', 'person_address')
        format: dict
        rows:
          - addressid: 1
            addressline1: 1970 Napa Ct.
            addressline2: null
            city: Bothell
            stateprovinceid: 79
            postalcode: "98011"
            modifieddate: "2007-12-04 00:00:00"
    expect:
      format: dict
      rows:
        - address_id: 1
          address_line_1: 1970 Napa Ct.
          address_line_2: null
          city: Bothell
          state_province_id: 79
          postal_code: "98011"
          modified_date: "2007-12-04 00:00:00"
