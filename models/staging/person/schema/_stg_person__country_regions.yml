version: 2

models:
  - name: stg_person__country_regions
    description: >
      Staging model for countries and regions. Renames source columns without
      applying business-rule corrections.
    columns:
      - name: country_region_code
        description: Source code identifying the country or region, when available.
        data_tests:
          - unique

      - name: country_region_name
        description: Name of the country or region.
        data_tests:
          - not_null

      - name: modified_date
        description: Timestamp of the last modification in the source system.
