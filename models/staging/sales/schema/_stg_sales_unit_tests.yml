version: 2

unit_tests:

  - name: test_stg_sales_customer_renames_and_casts
    description: Validates column renaming and integer casts in stg_sales_customer.
    model: stg_sales_customer
    given:
      - input: source('adventure_works', 'sales_customer')
        format: dict
        rows:
          - customerid: 11000
            personid: "13531"
            storeid: "296"
            territoryid: 9
            modifieddate: "2014-10-10 12:00:00"
    expect:
      format: dict
      rows:
        - customer_id: 11000
          person_id: 13531
          store_id: 296
          territory_id: 9
          modified_date: "2014-10-10 12:00:00"

  - name: test_stg_sales_order_header_renames_and_date_casts
    description: Validates order header renaming, foreign keys, metrics, and date casts.
    model: stg_sales_order_header
    given:
      - input: source('adventure_works', 'sales_salesorderheader')
        format: dict
        rows:
          - salesorderid: 43659
            revisionnumber: 8
            orderdate: "2011-05-31 00:00:00"
            duedate: "2011-06-12 00:00:00"
            shipdate: "2011-06-07 00:00:00"
            status: 5
            onlineorderflag: false
            purchaseordernumber: "PO522145787"
            accountnumber: "10-4020-000676"
            customerid: 29825
            salespersonid: 279
            territoryid: 5
            billtoaddressid: 985
            shiptoaddressid: 985
            shipmethodid: 5
            creditcardid: 16281
            currencyrateid: 4
            creditcardapprovalcode: "105041Vi84182"
            subtotal: 20565.6206
            taxamt: 1971.5149
            freight: 616.0984
            totaldue: 23153.2339
    expect:
      format: dict
      rows:
        - sales_order_id: 43659
          revision_number: 8
          order_date: "2011-05-31"
          due_date: "2011-06-12"
          ship_date: "2011-06-07"
          sales_order_status: 5
          online_order_flag: false
          purchase_order_number: "PO522145787"
          account_number: "10-4020-000676"
          customer_id: 29825
          sales_person_id: 279
          territory_id: 5
          bill_to_address_id: 985
          ship_to_address_id: 985
          ship_method_id: 5
          credit_card_id: 16281
          currency_rate_id: 4
          credit_card_approval_code: "105041Vi84182"
          subtotal_amount: 20565.6206
          tax_amount: 1971.5149
          freight_amount: 616.0984
          total_due_amount: 23153.2339

  - name: test_stg_sales_order_detail_renames
    description: Validates order detail identifiers, product fields, quantities, prices, and discounts.
    model: stg_sales_sales_order_detail
    given:
      - input: source('adventure_works', 'sales_salesorderdetail')
        format: dict
        rows:
          - salesorderdetailid: 1
            salesorderid: 43659
            carriertrackingnumber: "4911-403C-98"
            orderqty: 1
            productid: 776
            specialofferid: 1
            unitprice: 2024.994
            unitpricediscount: 0.0
            modifieddate: "2011-05-31 00:00:00"
    expect:
      format: dict
      rows:
        - sales_order_detail_id_pk: 1
          sales_order_id: 43659
          carrier_tracking_number: "4911-403C-98"
          order_qty: 1
          product_id: 776
          special_offer_id: 1
          unit_price: 2024.994
          unit_price_discount: 0.0
          modified_date: "2011-05-31 00:00:00"

  - name: test_stg_sales_order_header_sales_reason_renames
    description: Validates the sales-order-to-sales-reason bridge keys.
    model: stg_sales_sales_order_header_sales_reason
    given:
      - input: source('adventure_works', 'sales_salesorderheadersalesreason')
        format: dict
        rows:
          - salesorderid: 43697
            salesreasonid: 5
            modifieddate: "2011-05-31 00:00:00"
    expect:
      format: dict
      rows:
        - sales_order_id: 43697
          sales_reason_id: 5
          modified_date: "2011-05-31 00:00:00"

  - name: test_stg_sales_reason_renames
    description: Validates sales reason identifiers and descriptive attributes.
    model: stg_sales_sales_reason
    given:
      - input: source('adventure_works', 'sales_salesreason')
        format: dict
        rows:
          - salesreasonid: 5
            name: "Promotion"
            reasontype: "Promotion"
            modifieddate: "2011-04-01 00:00:00"
    expect:
      format: dict
      rows:
        - sales_reason_id: 5
          sales_reason_name: "Promotion"
          sales_reason_type: "Promotion"
          modified_date: "2011-04-01 00:00:00"

  - name: test_stg_sales_territory_renames
    description: Validates territory attributes, including the reserved source column `group`.
    model: stg_sales_territory
    given:
      - input: source('adventure_works', 'sales_salesterritory')
        format: dict
        rows:
          - territoryid: 1
            name: "Northwest"
            countryregioncode: "US"
            group: "North America"
            salesytd: 7887186.7882
            saleslastyear: 3298694.4938
            costytd: 0.0
            costlastyear: 0.0
            modifieddate: "2008-04-30 00:00:00"
    expect:
      format: dict
      rows:
        - territory_id: 1
          territory_name: "Northwest"
          country_region_code: "US"
          territory_group: "North America"
          sales_ytd_amount: 7887186.7882
          sales_last_year_amount: 3298694.4938
          cost_ytd_amount: 0.0
          cost_last_year_amount: 0.0
          modified_date: "2008-04-30 00:00:00"
