version: 2

unit_tests:
  - name: test_stg_sales__credit_cards_renames_and_casts
    description: Validates column renaming and integer casts in stg_sales__credit_cards.
    model: stg_sales__credit_cards
    given:
      - input: source('adventure_works', 'sales_creditcard')
        format: dict
        rows:
          - creditcardid: "16281"
            cardtype: SuperiorCard
            cardnumber: "33332664695310"
            expmonth: 11
            expyear: 2008
            modifieddate: "2013-07-29 00:00:00"
    expect:
      format: dict
      rows:
        - credit_card_id: 16281
          card_type: SuperiorCard
          card_number: "33332664695310"
          exp_month: 11
          exp_year: 2008
          modified_date: "2013-07-29 00:00:00"
