    model: stg_sales__order_headers
    given:
      - input: source('adventure_works', 'sales_salesorderheader')
        format: dict
        rows:
          - salesorderid: 43659
            revisionnumber: 8
            orderdate: "2011-05-31 00:00:00"
            duedate: "2011-06-12 00:00:00"
            shipdate: "2011-06-07 00:00:00"
            status: 5
            onlineorderflag: false
            purchaseordernumber: "PO522145787"
            accountnumber: "10-4020-000676"
            customerid: 29825
            salespersonid: 279
            territoryid: 5
            billtoaddressid: 985
            shiptoaddressid: 985
            shipmethodid: 5
            creditcardid: 16281
            currencyrateid: 4
            creditcardapprovalcode: "105041Vi84182"
            subtotal: 20565.6206
            taxamt: 1971.5149
            freight: 616.0984
            totaldue: 23153.2339
    expect:
      format: dict
