version: 2

unit_tests:
  - name: test_stg_sales__sales_reasons_renames
    description: Validates sales reason identifiers and descriptive attributes.
    model: stg_sales__sales_reasons
    given:
      - input: source('adventure_works', 'sales_salesreason')
        format: dict
        rows:
          - salesreasonid: 5
            name: Promotion
            reasontype: Promotion
            modifieddate: "2011-04-01 00:00:00"
    expect:
      format: dict
      rows:
        - sales_reason_id: 5
          sales_reason_name: Promotion
          sales_reason_type: Promotion
          modified_date: "2011-04-01 00:00:00"
