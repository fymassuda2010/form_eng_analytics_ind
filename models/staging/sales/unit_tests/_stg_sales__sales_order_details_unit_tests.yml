version: 2

unit_tests:
  - name: test_stg_sales__sales_order_details_renames
    description: Validates order detail identifiers, product fields, quantities, prices, and discounts.
    model: stg_sales__sales_order_details
    given:
      - input: source('adventure_works', 'sales_salesorderdetail')
        format: dict
        rows:
          - salesorderdetailid: 1
            salesorderid: 43659
            carriertrackingnumber: "4911-403C-98"
            orderqty: 1
            productid: 776
            specialofferid: 1
            unitprice: 2024.994
            unitpricediscount: 0.0
            modifieddate: "2011-05-31 00:00:00"
    expect:
      format: dict
      rows:
        - sales_order_detail_id_pk: 1
          sales_order_id: 43659
          carrier_tracking_number: "4911-403C-98"
          order_qty: 1
          product_id: 776
          special_offer_id: 1
          unit_price: 2024.994
          unit_price_discount: 0.0
          modified_date: "2011-05-31 00:00:00"
