version: 2

unit_tests:
  - name: test_stg_sales__territories_renames
    description: Validates territory attributes, including the reserved source column `group`.
    model: stg_sales__territories
    given:
      - input: source('adventure_works', 'sales_salesterritory')
        format: dict
        rows:
          - territoryid: 1
            name: Northwest
            countryregioncode: US
            group: North America
            salesytd: 7887186.7882
            saleslastyear: 3298694.4938
            costytd: 0.0
            costlastyear: 0.0
            modifieddate: "2008-04-30 00:00:00"
    expect:
      format: dict
      rows:
        - territory_id: 1
          territory_name: Northwest
          country_region_code: US
          territory_group: North America
          sales_ytd_amount: 7887186.7882
          sales_last_year_amount: 3298694.4938
          cost_ytd_amount: 0.0
          cost_last_year_amount: 0.0
          modified_date: "2008-04-30 00:00:00"
