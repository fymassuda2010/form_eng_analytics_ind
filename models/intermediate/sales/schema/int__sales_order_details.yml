version: 2

models:
  - name: int__sales_order_details
    description: >
      Intermediate model at the sales order detail grain. Enriches each order
      item with attributes from the sales order header and calculates gross,
      discount, and net amounts.

    columns:
      - name: sales_order_detail_id_pk
        description: Primary key of the sales order item and grain of the model.
        data_tests:
          - unique
          - not_null

      - name: sales_order_id
        description: Identifier of the sales order associated with the item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__order_headers')
                field: sales_order_id

      - name: customer_id
        description: Identifier of the customer who placed the order.

      - name: territory_id
        description: Identifier of the sales territory associated with the order.

      - name: credit_card_id
        description: Identifier of the credit card used for the order, when applicable.

      - name: bill_to_address_id
        description: Identifier of the billing address.

      - name: ship_to_address_id
        description: Identifier of the shipping address.

      - name: ship_method_id
        description: Identifier of the shipping method selected for the order.

      - name: currency_rate_id
        description: Identifier of the currency conversion rate, when applicable.

      - name: product_id
        description: Identifier of the product in the sales order item.
        data_tests:
          - not_null

      - name: special_offer_id
        description: Identifier of the special offer applied to the item.

      - name: revision_number
        description: Revision number of the sales order.

      - name: order_date
        description: Date on which the sales order was created.
        data_tests:
          - not_null

      - name: order_month
        description: First day of the month in which the sales order was created.
        data_tests:
          - not_null

      - name: due_date
        description: Date by which the sales order was expected to be fulfilled.

      - name: ship_date
        description: Date on which the sales order was shipped.

      - name: sales_order_status
        description: >
          Current status code of the order: 1 in process, 2 approved,
          3 backordered, 4 rejected, 5 shipped, or 6 cancelled.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6]
                quote: false

      - name: online_order_flag
        description: Indicates whether the order was placed online.

      - name: purchase_order_number
        description: Purchase order number supplied by the customer, when applicable.

      - name: account_number
        description: Customer account number associated with the sales order.

      - name: credit_card_approval_code
        description: Approval code returned for the credit card transaction.

      - name: carrier_tracking_number
        description: Carrier tracking number assigned to the shipped item.

      - name: order_qty
        description: Quantity of the product ordered in the sales order item.
        data_tests:
          - not_null

      - name: unit_price
        description: Unit price of the product before applying the discount.
        data_tests:
          - not_null

      - name: unit_price_discount
        description: Discount rate applied to the unit price, expressed as a decimal.
        data_tests:
          - not_null

      - name: gross_amount
        description: Gross item amount calculated as order quantity multiplied by unit price.
        data_tests:
          - not_null

      - name: discount_amount
        description: Discount amount calculated from quantity, unit price, and discount rate.
        data_tests:
          - not_null

      - name: net_amount
        description: Net item amount after deducting the discount from the gross amount.
        data_tests:
          - not_null
